# gob2native - Windows build (MSVC) with the unit tests and the package as
# a workflow artifact; the macOS build with the unit tests; the web build
# (Emscripten) and the LG webOS TV package (.ipk and its Homebrew Channel
# manifest) as artifacts.
# SPDX-License-Identifier: GPL-3.0-or-later
#
# The tests that need game data or GOG installers skip themselves here
# (none are on GitHub's machines). Every run keeps the packages as
# artifacts; a pushed version tag (v1.2.3) also makes a GitHub Release with
# the Windows, macOS and web zips and the webOS package.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    env:
      SDL2_VERSION: 2.32.10
    steps:
      - name: Keep line endings as in the repository
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - name: SDL2 (the official Visual C++ development package)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\sdl2.zip"
          Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL2_VERSION/SDL2-devel-$env:SDL2_VERSION-VC.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "SDL2_DIR=$env:RUNNER_TEMP\SDL2-$env:SDL2_VERSION\cmake" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        run: cmake -S . -B build -A x64 -DSDL2_DIR="$env:SDL2_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist/gobnative-windows-x64
          git describe --always --dirty | Out-File dist/gobnative-windows-x64/VERSION.txt -Encoding ascii
          Get-ChildItem dist/gobnative-windows-x64

      - name: Start the packaged programs
        shell: pwsh
        run: |
          # Each one starts (its DLLs and manifest are fine) and prints its usage.
          Set-Location dist/gobnative-windows-x64
          foreach ($t in "gobinstall", "gobrun", "gobview", "gobexport", "gobvideo", "gobdis", "stktool", "resdump") {
            $out = (& ".\$t.exe" 2>&1 | Out-String) # (exits with 1 or 2)
            if ($out -notmatch "usage") { throw "$t.exe did not start: $out" }
            Write-Output "$t.exe: ok"
          }
          # The GUI program, with a pref root whose name isn't ASCII: the
          # UTF-8 code page carries it from the command line to the folder.
          $root = Join-Path $env:RUNNER_TEMP ("prefs-" + [char]0x00FC + [char]0x0416 + [char]0x20AC)
          $p = Start-Process -FilePath .\gobnative.exe -ArgumentList "--game", "gob2", "--print-pref-dir", "--pref-root", "`"$root`"" `
            -Wait -NoNewWindow -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\gobnative.txt"
          $out = Get-Content "$env:RUNNER_TEMP\gobnative.txt" -Encoding utf8
          Write-Output "gobnative.exe: exit $($p.ExitCode), $out"
          if ($p.ExitCode -ne 0) { throw "gobnative.exe failed" }
          if (-not (Test-Path -LiteralPath (Join-Path $root "Gobliins2") -PathType Container)) { throw "no $root\Gobliins2" }
          $global:LASTEXITCODE = 0

      - uses: actions/upload-artifact@v7
        with:
          name: gobnative-windows-x64
          path: dist/gobnative-windows-x64
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: SDL2
        run: brew install sdl2

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package Gobnative.app (SDL2 inside, ad-hoc signed)
        run: |
          app=build/Gobnative.app
          mkdir -p "$app/Contents/Frameworks"
          sdl=$(otool -L "$app/Contents/MacOS/gobnative" | awk '/libSDL2/ {print $1}')
          cp "$(realpath "$sdl")" "$app/Contents/Frameworks/libSDL2-2.0.0.dylib"
          chmod u+w "$app/Contents/Frameworks/libSDL2-2.0.0.dylib"
          install_name_tool -id @rpath/libSDL2-2.0.0.dylib "$app/Contents/Frameworks/libSDL2-2.0.0.dylib"
          install_name_tool -change "$sdl" @executable_path/../Frameworks/libSDL2-2.0.0.dylib "$app/Contents/MacOS/gobnative"
          codesign --force --deep --sign - "$app"
          otool -L "$app/Contents/MacOS/gobnative" | grep -q /opt/homebrew && { echo "still linked to Homebrew"; exit 1; }
          mkdir -p dist
          ditto -c -k --keepParent "$app" dist/gobnative-macos-arm64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: gobnative-macos-arm64
          path: dist/gobnative-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web (Emscripten)
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: 6.0.12 # as used locally (scripts/build-web.sh)
    steps:
      - uses: actions/checkout@v5

      - name: Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"

      - name: Build
        run: scripts/build-web.sh

      - uses: actions/upload-artifact@v7
        with:
          name: gobnative-web
          path: dist/web
          if-no-files-found: error
          retention-days: 30

  webos:
    name: LG webOS TV
    runs-on: ubuntu-latest
    env:
      # The SDK for Linux hosts (GCC 14; the macOS one used locally is GCC 12),
      # webosbrew's SDL2 for webOS (bundled in the package), and the webOS CLI
      # for ares-package (scripts/build-webos.sh, docs/port-plan.md 6.8).
      WEBOS_SDK_URL: https://github.com/openlgtv/buildroot-nc4/releases/download/2026.08-webos/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
      SDL2_WEBOS_URL: https://github.com/webosbrew/SDL-webOS/releases/download/release-2.30.12-webos.5/SDL2-2.30.12-webos.tar.gz
      WEBOS_CLI_VERSION: 3.2.6
      # webosbrew's compatibility checker (ipk-verify) and its firmware data:
      # which webOS releases the package should run on, as apps-repo checks.
      WEBOSBREW_TOOLBOX: https://github.com/webosbrew/dev-toolbox-cli/releases/download/v20261017-2d5a7b6
      WEBOSBREW_TOOLBOX_VERSION: 0.10.0-1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tags: the package's version

      - name: webOS SDK, SDL-webOS and the webOS CLI
        run: |
          curl -fsSL "$WEBOS_SDK_URL" | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/arm-webos-linux-gnueabi_sdk-buildroot/relocate-sdk.sh"
          mkdir -p "$RUNNER_TEMP/sdl2-webos"
          curl -fsSL "$SDL2_WEBOS_URL" | tar -xz -C "$RUNNER_TEMP/sdl2-webos"
          npm install --prefix "$RUNNER_TEMP/webos-cli" --no-fund --no-audit "@webos-tools/cli@$WEBOS_CLI_VERSION"
          echo "WEBOS_SDK=$RUNNER_TEMP/arm-webos-linux-gnueabi_sdk-buildroot" >> "$GITHUB_ENV"
          echo "SDL2_WEBOS=$RUNNER_TEMP/sdl2-webos" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/webos-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Build the package
        run: |
          case "$GITHUB_REF" in
          refs/tags/v*) export GOB_VERSION="${GITHUB_REF_NAME#v}" ;;
          esac
          scripts/build-webos.sh

      - name: Check compatibility (webosbrew's ipk-verify)
        run: |
          for tool in fw-symbols ipk-verify; do
            curl -fsSLo "$RUNNER_TEMP/$tool.deb" "$WEBOSBREW_TOOLBOX/webosbrew-toolbox-${tool}_${WEBOSBREW_TOOLBOX_VERSION}_amd64.deb"
          done
          sudo apt-get install -y -qq "$RUNNER_TEMP/fw-symbols.deb" "$RUNNER_TEMP/ipk-verify.deb" >/dev/null
          # 0: runs on every release it knows; 1: not on some (older) ones,
          # which the report lists. Anything else is a broken package or check.
          status=0
          webosbrew-ipk-verify --format markdown --details --output dist/ipk-verify.md dist/*.ipk || status=$?
          cat dist/ipk-verify.md >> "$GITHUB_STEP_SUMMARY"
          [ "$status" -le 1 ]

      - uses: actions/upload-artifact@v7
        with:
          name: gobnative-webos
          path: |
            dist/*.ipk
            dist/*.manifest.json
            dist/ipk-verify.md
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, web, webos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Zip and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          (cd gobnative-windows-x64 && zip -qr ../gobnative-windows-x64.zip .)
          (cd gobnative-web && zip -qr ../gobnative-web.zip .)
          cp gobnative-macos-arm64/gobnative-macos-arm64.zip .
          # The TV package and its Homebrew Channel manifest as they are: the
          # manifest names the package next to it (releases/latest/download/).
          cp gobnative-webos/*.ipk gobnative-webos/*.manifest.json .
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "gobnative $GITHUB_REF_NAME" --generate-notes \
            gobnative-windows-x64.zip gobnative-macos-arm64.zip gobnative-web.zip *.ipk *.manifest.json
