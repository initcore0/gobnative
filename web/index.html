<!doctype html>
<!-- gob2native - web build page (scripts/build-web.sh copies it to dist/web/)
     SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gobnative</title>
<style>
	:root {
		--bg: #15161a;
		--fg: #d8d9de;
		--muted: #8b8d96;
		--accent: #f0c070;
		color-scheme: dark;
	}
	html, body {
		margin: 0;
		height: 100%;
		background: var(--bg);
		color: var(--fg);
		font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
	}
	body {
		display: flex;
		flex-direction: column;
	}
	header, footer {
		flex: none;
		padding: 8px 16px;
		display: flex;
		gap: 16px;
		align-items: baseline;
		flex-wrap: wrap;
	}
	header h1 {
		margin: 0;
		font-size: 16px;
		font-weight: 600;
	}
	header span, footer {
		color: var(--muted);
	}
	main {
		flex: 1;
		position: relative;
		min-height: 240px;
	}
	/* SDL follows the canvas's CSS size (and the device pixel ratio). */
	#canvas {
		position: absolute;
		inset: 0;
		width: 100%;
		height: 100%;
		display: block;
		outline: none;
		background: #000;
	}
	#loading {
		position: absolute;
		inset: 0;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 12px;
		pointer-events: none;
	}
	#loading progress {
		width: min(320px, 70vw);
		accent-color: var(--accent);
	}
	#status:empty {
		display: none;
	}
	#status {
		color: var(--accent);
	}
	a {
		color: var(--fg);
	}
	body.gob-drag #canvas {
		outline: 4px dashed #f0c060;
		outline-offset: -4px;
	}
</style>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<header>
	<h1>gobnative</h1>
	<span>Gobliiins, Gobliins 2 and Goblins Quest 3 in your browser</span>
	<span id="status"></span>
</header>
<main>
	<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
	<div id="loading">
		<progress></progress>
		<div id="loading-text">Loading gobnative...</div>
	</div>
</main>
<footer>
	Bring your own GOG copy; files stay in your browser.
	<span>Backquote (`) opens the overlay; hold Escape for the library.</span>
</footer>
<script>
	const statusLine = document.getElementById('status');
	const loading = document.getElementById('loading');
	const loadingText = document.getElementById('loading-text');

	// Developer options, only when the page is served from this computer:
	//   ?installer=/local/setup_....exe   import that installer (fetched from this server)
	//   ?arg=--play-at&arg=2&arg=gob2     command line arguments, as on the desktop
	const local = ['localhost', '127.0.0.1', '[::1]', '::1'].includes(location.hostname);
	const params = new URLSearchParams(location.search);
	const args = [];
	let devInstaller = null;
	if (local) {
		args.push(...params.getAll('arg'));
		devInstaller = params.get('installer');
		if (devInstaller) {
			const name = decodeURIComponent(devInstaller.split('/').pop());
			args.push('--import-at', '0.5', '/tmp/gobnative-import/' + name);
		}
	}

	var Module = {
		canvas: document.getElementById('canvas'),
		arguments: args,
		gobDevInstaller: devInstaller,
		print: (text) => console.log(text),
		printErr: (text) => console.warn(text),
		gobStatus: (text) => {
			statusLine.textContent = text;
			if (loading.style.display !== 'none' && text)
				loadingText.textContent = text;
		},
		setStatus: (text) => {
			if (text)
				loadingText.textContent = text;
		},
		onRuntimeInitialized: () => {
			loading.style.display = 'none';
			Module.canvas.focus();
		},
		onAbort: (what) => {
			loading.style.display = 'none';
			statusLine.textContent = 'gobnative stopped: ' + what;
		},
	};
	if (!document.createElement('canvas').getContext('webgl2')) {
		loadingText.textContent = 'This browser has no WebGL 2, which gobnative needs.';
		loading.querySelector('progress').remove();
	} else {
		const s = document.createElement('script');
		s.src = 'gobnative.js';
		s.onerror = () => { loadingText.textContent = 'Cannot load gobnative.js.'; };
		document.body.appendChild(s);
	}
</script>
</body>
</html>
